[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
]
extend-select = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"infra/stacks/bush_ranger_stack.py" = ["E402"]
"tests/**/*.py" = ["S101", "D102", "D103", "E402"]
"SampleAgent/**/*.py" = ["D100", "D103", "D104", "D200", "D205", "D415", "E501", "F841", "S110"]
"scripts/seed_sightings.py" = ["S311", "E501"]  # seed script uses random for test data, has long notes
"services/mcp_servers/*/server.py" = ["S104"]  # 0.0.0.0 binding required by AgentCore
"services/agent/handler.py" = ["S110"]  # best-effort MCP client cleanup

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["models", "services", "infra"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["infra/cdk\\.out/"]

[[tool.mypy.overrides]]
module = "aws_cdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bedrock_agentcore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "strands.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "strands_tools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "services.agent.steering.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "logging_config"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "services.mcp_servers.wildlife_sightings.server",
    "services.mcp_servers.conservation_docs.server",
    "services.mcp_servers.weather.server",
    "services.agent.handler",
]
disable_error_code = ["import-not-found"]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
